<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — F1 Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
    <a href="/" class="logo">F1<span>MANAGER</span></a>
    <nav>
        <a href="/">Главная</a>
        <a href="/race">Последняя гонка</a>
        <a href="/driver">Гонщик</a>
        <a href="/results">Результаты</a>
        <a href="/championship">Чемпионат</a>
        {% if session.get('username') %}
            <a href="/cabinet">Кабинет</a>
            <a href="/logout">Выйти</a>
        {% else %}
            <a href="/login">Войти</a>
            <a href="/register">Регистрация</a>
        {% endif %}
    </nav>
</header>

<main class="page narrow auth-page">
    <p class="eyebrow">ACCOUNT LOGIN</p>
    <h1>Вход</h1>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="post" class="auth-form">
        <label for="username">Имя пользователя</label>
        <input id="username" type="text" name="username" required>

        <label for="password">Пароль</label>
        <input id="password" type="password" name="password" required>

        <button type="submit">Войти</button>
    </form>

    <p class="muted auth-link">Нет аккаунта? <a href="/register">Зарегистрироваться</a></p>
</main>
</body>
</html>
